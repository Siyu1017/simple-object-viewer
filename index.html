<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Object Viewer</title>
    <meta name="theme-color" content="rgb(24,24,24)">
    <script src="./dist/index.umd.js"></script>
    <style>
        html {
            background: rgb(24, 24, 24);
            color: #dedede;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            padding: 1rem;
            margin: 0;
            overflow: auto;
        }

        h1 {
            margin-top: .5rem;
        }

        .viewer {
            width: 640px;
            height: 420px;
            border-radius: .5rem;
            box-shadow: 0px 0px 1px 0px rgb(154 154 154);
            overflow: auto;
            padding: .5rem;
            background: #1e1e1e;
        }

        hr {
            display: block;
            height: 1px;
            border: 0;
            border-top: 1px solid #424242;
            margin: 1em 0;
            padding: 0;
        }

        code {
            white-space: pre;
            background: #1e1e1e;
            padding: 1rem;
            border-radius: .5rem;
            box-shadow: 0px 0px 1px 0px rgb(154 154 154);
            height: fit-content;
            display: block;
            margin: 1rem 0;
        }
    </style>
</head>

<body>
    <h1 style="user-select: none;">Simple Object Viewer</h1>
    <hr>
    <h2>Demo</h2>
    <hr>
    <div id="myViewer" class="viewer"></div>
    <br>
    <div id="myViewer2" class="viewer"></div>
    <h2>Usage</h2>
    <hr>
    <ol style="order: 1;">
        <li>
            <div class="heading">Import Simple Object Viewer</div>
            <code>// ESM<br>import ObjectViewer from "./dist/index.js";</code>
            <code>&lt;-- UMD --&gt;<br>&lt;script src="./dist/index.umd.js"&gt;&lt;/script&gt;</code>
        </li>
        <li>
            <div class="heading">Create a new ObjectViewer instance</div>
            <code>const viewer = new ObjectViewer(container, obj);</code>
        </li>
        <li>
            <div class="heading">Done</div>
        </li>
    </ol>
    <script>
        const obj = window;

        const div = document.createElement("div");
        div.id = "demoDiv";
        div.className = "container highlight";
        div.textContent = "Hello World";
        const span = document.createElement("span");
        span.textContent = "Inner Span";
        div.appendChild(span);
        const divProto = Object.getPrototypeOf(div);
        const circularObj = {};
        circularObj.self = circularObj;
        const obj2 = {
            name: "Demo Object",
            count: 42,
            active: true,
            nothing: null,
            notDefined: undefined,
            nested: {
                alpha: 1,
                beta: [10, 20, 30],
                gamma: { x: "X", y: "Y" },
            },
            list: ["one", "two", { key: "value" }],
            greet: function (name) { return `Hello ${name}`; },
            asyncFunction: async function myAsyncFunc() { },
            arrowFunction: () => { },
            asyncArrowFunction: async () => { },
            class: class MyClass { },
            _secret: 99,
            get secret() { return this._secret; },
            set secret(val) { this._secret = val; },
            element: div,
            elementPrototype: divProto,
            circular: circularObj,
            map: new Map([["key1", 1], ["key2", 2]]),
            set: new Set([1, 2, 3])
        };

        const container = document.getElementById('myViewer');
        const container2 = document.getElementById('myViewer2');
        const viewer = new ObjectViewer(container, obj);
        const viewer2 = new ObjectViewer(container2, {
    name: 'John',
    age: 30,
    address: {
        city: 'New York',
        zip: 100
    }
});
    </script>
</body>

</html>
